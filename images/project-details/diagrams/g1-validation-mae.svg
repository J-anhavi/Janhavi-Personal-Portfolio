<svg xmlns="http://www.w3.org/2000/svg" width="850" height="285" viewBox="0 0 850 285" role="img" aria-label="Random Forest MAE 0.01793 and linear regression MAE 0.01975 on a validation split"><title>Random Forest MAE 0.01793 and linear regression MAE 0.01975 on a validation split</title><rect x="0" y="0" width="850" height="285" rx="14" fill="#f7f3eb"/><text x="28" y="40" font-family="Arial" font-size="17" fill="#2c3029" font-weight="600">Validation mean absolute error</text><text x="30" y="75" font-family="Arial" font-size="15" fill="#2c3029">Random Forest</text><rect x="30" y="90" width="459" height="27" rx="5" fill="#d9e2d7" stroke="#a5aa9e"/><text x="503" y="110" font-family="Arial" font-size="16" fill="#2c3029">0.01793</text><text x="30" y="151" font-family="Arial" font-size="15" fill="#2c3029">Linear regression</text><rect x="30" y="166" width="506" height="27" rx="5" fill="#f0dfc0" stroke="#a5aa9e"/><text x="550" y="186" font-family="Arial" font-size="16" fill="#2c3029">0.01975</text><text x="30" y="251" font-family="Arial" font-size="13" fill="#566058">Lower is better. November 14, 2026 validation checkpoint, not final test.</text></svg>